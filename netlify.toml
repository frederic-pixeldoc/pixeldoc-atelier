# Builds Netlify suspendus (crédit épuisé) : le site est servi gratuitement par GitHub Pages.
# Pour réactiver Netlify : supprimer le bloc [build] ci-dessous.
[build]
  ignore = "exit 0"

# Configuration Netlify
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# En-têtes de sécurité (appliqués seulement si le site est servi par Netlify ; GitHub Pages ne permet pas d'en définir).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fichiers de l'appli : toujours revalidés (le service worker gère le hors-ligne)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
